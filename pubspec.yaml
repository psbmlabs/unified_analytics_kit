name: unified_analytics_kit
description: "Unified Flutter analytics toolkit that sends events to Firebase, Facebook and your own backend with one API, a persistent device ID and an offline queue."
version: 1.0.4
repository: https://github.com/psbmlabs/unified_analytics_kit
issue_tracker: https://github.com/psbmlabs/unified_analytics_kit/issues
publish_to: none

environment:
  sdk: ^3.13.7
  flutter: ">=3.22.0"

dependencies:
  android_id: ^0.6.0
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  device_info_plus: ^13.3.0
  facebook_app_events: ^0.32.0
  firebase_analytics: ^13.0.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  http: ^1.6.0
  package_info_plus: ^10.2.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter: